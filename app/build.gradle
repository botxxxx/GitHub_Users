plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'dagger.hilt.android.plugin'
}

static def getVersionCode() { return 1 }

static def getVersionName() { return "0.0.1" + new Date().format('MMddHH') }

android {
    namespace 'com.example.test'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.test"
        minSdk 29
        targetSdk 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode getVersionCode()
        versionName getVersionName()
        javaCompileOptions {
            annotationProcessorOptions {
                arguments["dagger.hilt.disableModulesHaveInstallInCheck"] = "true"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true
    }
}

dependencies {
    // base
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.8.0'
    // java_navigation
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    // lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
    implementation 'androidx.paging:paging-common:3.1.1'
    implementation 'androidx.paging:paging-runtime:3.1.1'
    // room
    implementation 'androidx.room:room-common:2.5.0'
    implementation 'androidx.room:room-paging:2.5.0'
    annotationProcessor 'androidx.room:room-compiler:2.5.0'
    // dagger
    annotationProcessor 'com.google.dagger:hilt-android-compiler:2.45'
    implementation 'com.google.dagger:hilt-android:2.45'
    // glide
    annotationProcessor "com.github.bumptech.glide:compiler:4.14.2"
    implementation "com.github.bumptech.glide:glide:4.14.2"
    // network
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    // testing
    androidTestAnnotationProcessor 'com.google.dagger:hilt-android-compiler:2.45' //Changed kapt to annotationProcessor
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}